part: 1
audio: /audio/academic/sample-01/part-1.opus
durationSec: 30.146
transcript: part-1.transcript.md
groups:
  - id: L1-g1-form
    instructions: 'Label the garden plan below. Write NO MORE THAN TWO WORDS AND/OR A NUMBER for each answer.'
    interaction: gap
    qtype: map-plan-labelling
    image: /images/academic/sample-01/workshop-plan.svg
    imageAlt: 'Plan of a garden workshop site, with north at the top. Label 1 points to the entry on the south edge, and label 2 points to the gate beside bicycle parking on the north edge.'
    wordLimit:
      words: 2
      numberAllowed: true
    template: |
      Garden workshop booking
      - Meeting point: the {{1}}
      - Leave bikes by the {{2}}
    questions:
      - id: L1-q1
        number: 1
        answers: ['main entrance']
        explanation: 'The clerk names the main entrance as the starting point for the workshop.'
        evidence:
          quote: 'The workshop starts at the main entrance'
          audioStart: 10.5
      - id: L1-q2
        number: 2
        answers: ['north gate']
        explanation: 'The visitor asks about bicycle parking, and the clerk directs them to the north gate.'
        evidence:
          quote: 'leave them by the north gate'
          audioStart: 17.4

  - id: L1-g2-match
    instructions: 'What is each item needed for? Choose the correct letter, A–C.'
    interaction: select
    qtype: matching-features
    allowReuse: false
    options:
      A: 'for protecting the hands'
      B: 'for digging holes'
      C: 'for carrying water'
    questions:
      - id: L1-q3
        number: 3
        prompt: 'gloves'
        answers: ['A']
        explanation: 'Gloves are described as protection for the hands, not as tools for digging or watering.'
        evidence:
          quote: 'a pair of gloves to protect your hands'
          audioStart: 21.9
      - id: L1-q4
        number: 4
        prompt: 'a trowel'
        answers: ['B']
        explanation: 'The clerk says that the small trowel is used for digging holes.'
        evidence:
          quote: 'a small trowel for digging holes'
          audioStart: 25.0
